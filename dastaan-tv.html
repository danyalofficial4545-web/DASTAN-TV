:12px;color:#c8cbd4;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:10px;background:#1b1f28;color:#fff;border:1px solid var(--l);outline:0}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--g)}.list{display:grid;gap:9px;align-content:start}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--l);border-radius:11px;background:#151922}.row small{display:block;color:var(--m)}.row div:last-child{display:flex;gap:6px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-box{width:min(440px,100%);padding:30px;border:1px solid #54472b;border-radius:23px;background:#11141b;box-shadow:0 20px 70px #000}.auth-box h1{font:700 30px/1.05 Georgia}.auth-box p{color:var(--m)}.pass{position:relative}.pass input{padding-right:60px}.pass button{position:absolute;right:4px;top:4px;border:0;background:none;color:var(--g2);padding:6px}.switch{text-align:center;color:var(--m);font-size:13px;margin-top:16px}.switch button{border:0;background:none;color:var(--g2);padding:0}.notice{margin-bottom:14px;padding:10px;border:1px solid var(--l);border-radius:9px;color:#dce0ea}.notice.error{color:#ffb1b1;border-color:#763f48}.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:15px;background:#000b}.dialog{width:min(1000px,100%);max-height:94vh;overflow:auto;border:1px solid #5a4929;border-radius:18px;background:#0e1117}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;border-bottom:1px solid var(--l)}.dialog-head h2{margin:0;font:700 21px Georgia}.stage{position:relative;aspect-ratio:16/9;background:#000;display:grid;place-items:center}.stage video,.stage iframe{width:100%;height:100%;border:0;object-fit:contain}.stage-msg{padding:25px;color:var(--m);text-align:center}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px;bo </style></head><body><div id="root"></div><script>
const AU='danyal955163',AP='danyal4349',DK='dastaan_db_v5',SK='dastaan_session_v5';function safeGet(k,fallback=null){try{return window.localStorage.getItem(k)??fallback}catch(err){console.warn('Storage read unavailable',err);return fallback}}function safeSet(k,v){try{window.localStorage.setItem(k,v);return true}catch(err){console.warn('Storage write unavailable',err);return false}}function safeRemove(k){try{window.localStorage.removeItem(k)}catch(err){console.warn('Storage remove unavailable',err)}}let db=readDB(),session=safeGet(SK),route={p:'home',c:null,s:null};const $=s=>document.querySelector(s),E=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const fresh=()=>({brand:{name:'DASTAAN-TV',banner:''},categories:[]});function readDB(){try{let x=JSON.parse(safeGet(DK,'null'));return x&&Array.isArray(x.categories)?x:fresh()}catch(err){console.warn('Database reset after invalid data',err);return fresh()}}function save(){return safeSet(DK,JSON.stringify(db))}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}function currentUser(){try{return JSON.parse(session||'{}')}catch{return {}}}function isAdmin(){return currentUser().admin===true}function auth(){document.body.innerHTML='<div class="auth"><div class="auth-box"><div class="brand"><span class="mark">D</span><span><b>DASTAAN-TV</b><small>Royal streaming archive</small></span></div><div class="eyebrow" style="margin-top:28px">Welcome</div><h1 id="at">Please Create Your Username and Password</h1><p id="ah">Create an account to enter the empty archive.</p><form id="af"><div class="field"><label>Username</label><input id="u" required minlength="3" autocomplete="username"></div><div class="field"><label>Password</label><div class="pass"><input id="p" type="password" required minlength="4" autocomplete="current-password"><button type="button" id="show">Show</button></div></div><div id="ae"></div><button class="primary" style="width:100%" id="as">Create Account</button></form><div class="switch"><span id="st">Already have an account?</span> <button id="sw">Login</button></div></div></div>';let mode='create';$('#show').onclick=()=>{$('#p').type=$('#p').type==='password'?'text':'password';$('#show').textContent=$('#p').type==='password'?'Show':'Hide'};$('#sw').onclick=()=>{mode=mode==='create'?'login':'create';$('#at').textContent=mode==='create'?'Please Create Your Username and Password':'Login to Dastaan-TV';$('#ah').textContent=mode==='create'?'Create an account to enter the empty archive.':'Enter your credentials to continue.';$('#as').textContent=mode==='create'?'Create Account':'Login';$('#st').textContent=mode==='create'?'Already have an account?':'Need an account?';$('#sw').textContent=mode==='create'?'Login':'Create Account';$('#ae').innerHTML=''};$('#af').onsubmit=e=>{e.preventDefault();let u=$('#u').value.trim(),p=$('#p').value;if(u===AU&&p===AP){session=JSON.stringify({u,admin:true});safeSet(SK,session);app();return}let users=JSON.parse(safeGet('dastaan_users','[]')||'[]'),m=users.find(x=>x.u===u&&x.p===p);if(mode==='create'){if(users.some(x=>x.u===u))return $('#ae').innerHTML='<div class="notice error">Username exists. Use Login.</div>';users.push({u,p});safeSet('dastaan_users',JSON.stringify(users));session=JSON.stringify({u,admin:false});safeSet(SK,session);app()}else if(m){session=JSON.stringify({u,admin:false});safeSet(SK,session);app()}else $('#ae').innerHTML='<div class="notice error">Incorrect username or password.</div>'}}
function app(){if(!session)return auth();shell();page()}function shell(){document.body.innerHTML='<header class="top"><div class="wrap nav"><a class="brand" href="#" id="home"><span class="mark">D</span><span><b>'+E(db.brand.name||'DASTAAN-TV')+'</b><small>Royal streaming archive</small></span></a><div class="actions"><span class="desktop" style="color:var(--m);font-size:12px">'+E(currentUser().u||'User')+(isAdmin()?' · ADMIN':'')+'</span>'+(isAdmin()?'<button id="admin">Admin Panel</button>':'')+'<button id="out">Logout</button></div></div></header><main class="wrap main" id="main"></main><footer class="wrap" style="border-top:1px solid var(--l);padding:24px 0;color:var(--m);font-size:12px">DASTAAN-TV · Private local archive. Publish only content you have permission to share.</footer><div id="toast" class="toast"></div>';$('#home').onclick=e=>{e.preventDefault();route={p:'home'};page()};$('#out').onclick=()=>{safeRemove(SK);session=null;auth()};if($('#admin'))$('#admin').onclick=()=>{route={p:'admin'};page()}}
function page(){if(route.p==='admin')return admin();if(route.p==='seasons')return seasons();if(route.p==='episodes')return episodes();home()};function pic(x){let im=x.image||x.thumbnail;return '<div class="pic">'+(im?'<img src="'+E(im)+'" onerror="this.remove()">':'')+'<span>'+E((x.name||x.title||'D')[0].toUpperCase())+'</span></div>'};function empty(t,s){return '<div class="empty"><div><b>'+t+'</b><span>'+s+'</span></div></div>'}
function home(){let m=$('#main'),cs=db.categories;m.innerHTML='<section class="hero"><div><div class="eyebrow">Dastaan-TV · Private archive</div><h1>Every story has a <span>place.</span></h1><p>'+E(db.brand.banner||'Your archive is ready. The Admin can add main categories, seasons and episodes from Admin Panel.')+'</p>'+(isAdmin()?'<button class="primary" id="heroAdmin">Open Admin Panel</button>':'')+'</div></section><div class="section"><div><h2>Main Categories</h2><p>Choose a collection to browse its seasons.</p></div><span style="color:var(--g2)">'+cs.length+' categories</span></div>'+(cs.length?'<div class="grid">'+cs.map(c=>'<article class="card"><div data-c="'+c.id+'">'+pic(c)+'</div><div class="body"><h3>'+E(c.name)+'</h3><p>'+E(c.description||'Explore seasons and episodes.')+'</p><div class="meta"><span>'+c.seasons.length+' seasons</span><span>'+E(c.type||'Collection')+'</span></div><button class="primary full" data-c="'+c.id+'">Open category</button></div></article>').join('')+'</div>':empty('Your dashboard is empty','There are no categories yet. The Admin can add the first collection.'));m.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{route={p:'seasons',c:x.dataset.c};page()});if($('#heroAdmin'))$('#heroAdmin').onclick=()=>{route={p:'admin'};page()}}
function seasons(){let c=cat(route.c);if(!c)return route={p:'home'},page();let m=$('#main');m.innerHTML='<div class="crumb"><button id="bh">Home</button><span>›</span><span>'+E(c.name)+'</span></div><div class="section"><div><h2>'+E(c.name)+' <span>Seasons</span></h2><p>Select a season to see all episodes.</p></div></div>'+(c.seasons.length?'<div class="grid">'+c.seasons.map(s=>'<article class="card"><div data-s="'+s.id+'">'+pic(s)+'</div><div class="body"><h3>'+E(s.name)+'</h3><p>'+E(s.description||'Browse all episodes.')+'</p><div class="meta"><span>'+s.episodes.length+' episodes</span></div><button class="primary full" data-s="'+s.id+'">Open season</button></div></article>').join('')+'</div>':empty('No seasons yet','The Admin can add seasons to this category.'));$('#bh').onclick=()=>{route={p:'home'};page()};m.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{route={p:'episodes',c:c.id,s:x.dataset.s};page()})}
function episodes(){let c=cat(route.c),s=sea(route.c,route.s);if(!c||!s)return route={p:'home'},page();let m=$('#main');m.innerHTML='<div class="crumb"><button id="bh">Home</button><span>›</span><button id="bc">'+E(c.name)+'</button><span>›</span><span>'+E(s.name)+'</span></div><div class="section"><div><h2>'+E(s.name)+' <span>Episodes</span></h2><p>Episodes open inside the website player.</p></div></div>'+(s.episodes.length?'<div class="grid">'+s.episodes.map((e,i)=>'<article class="card"><div data-e="'+e.id+'">'+pic(e)+'</div><div class="body"><h3>'+E(e.name||'Episode '+(i+1))+'</h3><p>'+E(e.description||'Play inside Dastaan-TV.')+'</p><div class="meta"><span>Episode '+(i+1)+'</span><span>'+(e.videoUrl?'Ready':'No link')+'</span></div><button class="primary full" data-e="'+e.id+'">▶ Play episode</button></div></article>').join('')+'</div>':empty('No episodes yet','The Admin can upload episodes to this season.'));$('#bh').onclick=()=>{route={p:'home'};page()};$('#bc').onclick=()=>{route={p:'seasons',c:c.id};page()};m.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>player(s.episodes.find(e=>e.id===x.dataset.e)))}
function admin(){if(!isAdmin())return route={p:'home'},page();let m=$('#main');m.innerHTML='<div class="section"><div><div class="eyebrow">Restricted area</div><h2>Admin <span>Panel</span></h2><p>Manage category → season → episode.</p></div><button id="back">Back to site</button></div><div class="admin"><div class="tabs"><button class="active" data-tab="cat">Main Categories</button><button data-tab="sea">Seasons</button><button data-tab="ep">Episodes</button><button data-tab="brand">Logo / Banner</button></div><div id="adminBox"></div></div>';$('#back').onclick=()=>{route={p:'home'};page()};m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{m.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab(b.dataset.tab)});tab('cat')}
function tab(t,edit){if(t==='cat')return catTab(edit);if(t==='sea')return seaTab(edit);if(t==='ep')return epTab(edit);brandTab()};function formField(label,id,value,type='text',extra=''){return '<div class="field"><label>'+label+'</label><'+(type==='textarea'?'textarea':'input')+' id="'+id+'" '+(type!=='textarea'?'type="'+type+'"':'')+' '+extra+'>'+E(value||'')+'</'+(type==='textarea'?'textarea':'input')+'></div>'}
function catTab(edit){let old=edit?cat(edit):{},b=$('#adminBox');b.innerHTML='<div class="admin-grid"><form class="form" id="f"><h3>'+(edit?'Edit':'Create')+' Main Category</h3>'+formField('Name','n',old.name,'text','required')+formField('Poster / thumbnail URL','i',old.image,'url')+formField('Description','d',old.description,'textarea')+'<button class="primary">'+(edit?'Save changes':'Create category')+'</button></form><div class="list">'+(db.categories.map(c=>'<div class="row"><div><b>'+E(c.name)+'</b><small>'+c.seasons.length+' season(s)</small></div><div><button data-edit="'+c.id+'">Edit</button><button class="danger" data-del="'+c.id+'">Delete</button></div></div>').join('')||empty('No categories','Create your first category.'))+'</div></div>';$('#f').onsubmit=e=>{e.preventDefault();let d={name:$('#n').value.trim(),image:$('#i').value.trim(),description:$('#d').value.trim()};if(edit)Object.assign(cat(edit),d);else db.categories.push({id:uid(),...d,seasons:[]});save();msg(edit?'Updated':'Category created');tab('cat')};b.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>tab('cat',x.dataset.edit));b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(confirm('Delete category and all nested content?')){db.categories=db.categories.filter(c=>c.id!==x.dataset.del);save();tab('cat')}})}
function seaTab(edit){let old=edit?sea(edit.c,edit.s):{},b=$('#adminBox');b.innerHTML='<div class="admin-grid"><form class="form" id="f"><h3>'+(edit?'Edit':'Create')+' Season</h3><div class="field"><label>Main category</label><select id="c">'+db.categories.map(c=>'<option value="'+c.id+'" '+(c.id===(edit?.c||db.categories[0]?.id)?'selected':'')+'>'+E(c.name)+'</option>').join('')+'</select></div>'+formField('Season name','n',old.name,'text','required')+formField('Season poster URL','i',old.image,'url')+formField('Description','d',old.description,'textarea')+'<button class="primary">'+(edit?'Save changes':'Create season')+'</button></form><div class="list">'+db.categories.flatMap(c=>c.seasons.map(s=>'<div class="row"><div><b>'+E(s.name)+'</b><small>'+E(c.name)+' · '+s.episodes.length+' episode(s)</small></div><div><button data-edit="'+c.id+'|'+s.id+'">Edit</button><button class="danger" data-del="'+c.id+'|'+s.id+'">Delete</button></div></div>')).join('')+'</div></div>';$('#f').onsubmit=e=>{e.preventDefault();let c=cat($('#c').value),d={name:$('#n').value.trim(),image:$('#i').value.trim(),description:$('#d').value.trim()};if(edit)Object.assign(sea(edit.c,edit.s),d);else c.seasons.push({id:uid(),...d,episodes:[]});save();msg(edit?'Updated':'Season created');tab('sea')};b.querySelectorAll('[data-edit]').forEach(x=>{let [c,s]=x.dataset.edit.split('|');x.onclick=()=>tab('sea',{c,s})});b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{let [c,s]=x.dataset.del.split('|');if(confirm('Delete season and episodes?')){cat(c).seasons=cat(c).seasons.filter(z=>z.id!==s);save();tab('sea')}})}
function epTab(edit){let old=edit?sea(edit.c,edit.s).episodes.find(e=>e.id===edit.e):{},first=db.categories[0],b=$('#adminBox');b.innerHTML='<div class="admin-grid"><form class="form" id="f"><h3>'+(edit?'Edit':'Add')+' Episode</h3><div class="field"><label>Main category</label><select id="c">'+db.categories.map(c=>'<option value="'+c.id+'" '+(c.id===(edit?.c||first?.id)?'selected':'')+'>'+E(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Season</label><select id="s">'+(cat(edit?.c||first?.id)?.seasons||[]).map(x=>'<option value="'+x.id+'" '+(x.id===(edit?.s||first?.seasons[0]?.id)?'selected':'')+'>'+E(x.name)+'</option>').join('')+'</select></div>'+formField('Episode name','n',old.name,'text','required')+formField('External video URL (MP4/M3U8/Telegram/site)','v',old.videoUrl,'url','required')+formField('Thumbnail URL','i',old.thumbnail,'url')+formField('Description','d',old.description,'textarea')+'<button class="primary">'+(edit?'Save changes':'Add episode')+'</button></form><div class="list">'+db.categories.flatMap(c=>c.seasons.flatMap(s=>s.episodes.map(e=>'<div class="row"><div><b>'+E(e.name)+'</b><small>'+E(c.name)+' / '+E(s.name)+'</small></div><div><button data-edit="'+c.id+'|'+s.id+'|'+e.id+'">Edit</button><button class="danger" data-del="'+c.id+'|'+s.id+'|'+e.id+'">Delete</button></div></div>'))).join('')+'</div></div>';$('#f').onsubmit=e=>{e.preventDefault();let s=sea($('#c').value,$('#s').value),d={name:$('#n').value.trim(),videoUrl:$('#v').value.trim(),thumbnail:$('#i').value.trim(),description:$('#d').value.trim()};if(edit)Object.assign(s.episodes.find(x=>x.id===edit.e),d);else s.episodes.push({id:uid(),...d});save();msg(edit?'Updated':'Episode added');tab('ep')};$('#c').onchange=()=>{$('#s').innerHTML=(cat($('#c').value)?.seasons||[]).map(x=>'<option value="'+x.id+'">'+E(x.name)+'</option>').join('')};b.querySelectorAll('[data-edit]').forEach(x=>{let [c,s,e]=x.dataset.edit.split('|');x.onclick=()=>tab('ep',{c,s,e})});b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{let [c,s,e]=x.dataset.del.split('|');if(confirm('Delete episode?')){let z=sea(c,s);z.episodes=z.episodes.filter(q=>q.id!==e);save();tab('ep')}})}
function brandTab(){let b=$('#adminBox');b.innerHTML='<div class="admin-grid"><form class="form" id="f"><h3>Logo / Banner</h3>'+formField('Website name','n',db.brand.name)+formField('Logo URL','i',db.brand.logo,'url')+formField('Featured banner text','d',db.brand.banner,'textarea')+'<button class="primary">Save branding</button></form><div class="notice"><b>Empty database mode</b><br>No demo dramas, posters or pictures are included. Everything is added by Admin and saved to this browser LocalStorage.</div></div>';$('#f').onsubmit=e=>{e.preventDefault();db.brand={name:$('#n').value.trim()||'DASTAAN-TV',logo:$('#i').value.trim(),banner:$('#d').value.trim()};save();shell();route={p:'admin'};page();msg('Branding saved')}}
function player(ep){let d=document.createElement('div');d.className='modal';d.innerHTML='<div class="dialog"><div class="dialog-head"><h2>'+E(ep.name)+'</h2><button id="x">×</button></div><div class="stage" id="stage"><div class="stage-msg">Loading player…</div><div class="lock" id="lk"><span>🔒</span></div></div><div class="controls"><button id="back">↶ 10s</button><button id="pp">▶ Play</button><button id="fwd">10s ↷</button><label>☀ <input id="br" type="range" min="50" max="150" value="100"></label><label>🔊 <input id="vo" type="range" min="0" max="1" step=".05" value="1"></label><select id="sp"><option>1</option><option>1.5</option><option>2</option></select><button id="fs">⛶</button><button id="lkb">🔒 Lock</button></div></div>';document.body.appendChild(d);d.onclick=e=>{if(e.target===d)d.remove()};$('#x').onclick=()=>d.remove();let st=$('#stage'),is=/\.(mp4|webm|ogg|m3u8)(\?|#|$)/i.test(ep.videoUrl);if(is){st.innerHTML='<video id="vid" playsinline controls src="'+E(ep.videoUrl)+'"></video><div class="lock" id="lk"><span>🔒</span></div>';let v=$('#vid');$('#pp').onclick=()=>v.paused?v.play():v.pause();$('#back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-10);$('#fwd').onclick=()=>v.currentTime+=10;$('#vo').oninput=e=>v.volume=e.target.value;$('#sp').onchange=e=>v.playbackRate=e.target.value;$('#br').oninput=e=>v.style.filter='brightness('+e.target.value+'%)'}else{st.innerHTML='<iframe src="'+E(ep.videoUrl)+'" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe><div class="lock" id="lk"><span>🔒</span></div>';$('#pp').disabled=$('#back').disabled=$('#fwd').disabled=true;$('#br').oninput=e=>st.querySelector('iframe').style.filter='brightness('+e.target.value+'%)'}$('#fs').onclick=()=>st.requestFullscreen?.();$('#lkb').onclick=()=>$('#lk').classList.toggle('show')}
function boot(){try{if(session)app();else auth()}catch(err){console.error('DASTAAN-TV boot recovery',err);session=null;safeRemove(SK);try{auth()}catch(fallbackErr){document.body.innerHTML='<main style=\"min-height:100vh;display:grid;place-items:center;background:#08090d;color:#f5f3ec;font:16px system-ui;padding:24px;text-align:center\"><div><h1 style=\"font-family:Georgia\">DASTAAN-TV</h1><p>Please refresh the page to continue.</p></div></main>'}}}boot();
</script></body></html>
